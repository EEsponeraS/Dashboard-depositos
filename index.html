function b64d(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function sha256hex(s){ const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); }
async function signIn(e){
  e.preventDefault();
  const user = document.getElementById('user').value.trim().toLowerCase();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err'), btn = document.getElementById('btn');
  err.textContent = '';
  if (!user || !pw){ err.textContent = 'Please enter user and password.'; return; }
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream){ err.textContent = 'This browser is not supported. Please use an up-to-date Chrome, Edge or Safari.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const rec = VAULT.users[await sha256hex(VAULT.prefix + user)];
    if (!rec) throw new Error('no user');
    const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(rec.salt), iterations: VAULT.iter, hash: 'SHA-256' },
      keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(rec.iv) }, key, b64d(rec.ct));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (x) {
    btn.disabled = false; btn.textContent = 'Sign in';
    err.textContent = 'Wrong user or password.';
  }
}
document.getElementById('f').addEventListener('submit', signIn);
</script>
